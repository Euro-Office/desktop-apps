name: Package licence metadata

on:
  pull_request:
    paths:
      - 'package/**'
      - 'win-linux/src/version.h'
      - 'win-linux/extras/*/src/version.h'
      - '.github/workflows/package-licence.yml'
  push:
    branches:
      - main
    paths:
      - 'package/**'
      - 'win-linux/src/version.h'
      - 'win-linux/extras/*/src/version.h'
      - '.github/workflows/package-licence.yml'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Render debian/copyright and check licence fields
        run: package/test/licence-metadata.sh
