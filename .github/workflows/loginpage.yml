name: Start page tests

on:
  pull_request:
    paths:
      - 'common/loginpage/**'
      - '.github/workflows/loginpage.yml'
  push:
    branches:
      - main
    paths:
      - 'common/loginpage/**'
      - '.github/workflows/loginpage.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: loginpage-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: common/loginpage/test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: common/loginpage/test/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npx vitest run
